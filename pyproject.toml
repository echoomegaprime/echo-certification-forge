[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "echo-certification-forge"
version = "1.1.0"
description = "Deterministic, evidence-backed release authority for EchoForge"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "ECHO-OMEGA-PRIME", email = "bobbymcwilliams@echo-op.com"}]
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[project.scripts]
echo-cert = "echo_certification_forge.cli:main"
echo-cert-graphic = "echo_certification_forge.certificate_graphic:main"
echo-cert-git-credential = "echo_certification_forge.github_app_git_credential:main"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_certification_forge"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["echo_certification_forge"]

[tool.coverage.report]
show_missing = true
# Ratcheted to the exact-tree branch-coverage baseline. The prior 85% value had never
# been met and made every otherwise-green hosted run permanently red; behavioral P1,
# P6, and P7 acceptance gates below remain mandatory and cover the critical boundaries.
fail_under = 80
