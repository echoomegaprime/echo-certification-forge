name: P4 validation

on:
  push:
    branches: [p4-readiness-race-validation-20260717]
  pull_request:
    branches: [main]

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src scripts/p4_hostile_acceptance.py scripts/p4_hostile_acceptance_exact.py scripts/p4_hostile_acceptance_hardened.py tests
      - run: python -m pytest -q tests/test_p4_hostile_acceptance_exact.py tests/test_p4_hostile_acceptance_hardened.py
      - run: python -m pytest -q --cov=echo_certification_forge --cov-branch --cov-report=term-missing
