name: certification-forge-ci

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-forge-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and verification dependencies
        run: python -m pip install -e ".[dev]"

      - name: Record tested source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          git rev-parse HEAD | tee ci-artifacts/tested-commit.txt
          git status --short | tee ci-artifacts/pre-gate-status.txt

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests

      - name: Validate installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check | tee ci-artifacts/pip-check.txt

      - name: Run source tests with branch coverage floor
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --cov=echo_certification_forge --cov-branch --cov-report=term-missing --cov-report=json:ci-artifacts/coverage.json | tee ci-artifacts/pytest.txt

      - name: Bind local verification branch to tested commit
        shell: bash
        run: |
          set -euo pipefail
          git branch -f main HEAD
          git checkout main
          test "$(git rev-parse HEAD)" = "$(cat ci-artifacts/tested-commit.txt)"

      - name: Run deterministic P1 verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p1.py | tee ci-artifacts/verify-p1.json

      - name: Run deterministic P2 verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p2.py | tee ci-artifacts/verify-p2.json

      - name: Run deterministic P3 verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p3.py | tee ci-artifacts/verify-p3.json

      - name: Run deterministic P4 verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p4.py | tee ci-artifacts/verify-p4.json

      - name: Record post-gate repository state
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          git rev-parse HEAD > ci-artifacts/post-gate-commit.txt
          git status --short > ci-artifacts/post-gate-status.txt
          sha256sum ci-artifacts/* > ci-artifacts/SHA256SUMS

      - name: Upload deterministic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-gates-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
