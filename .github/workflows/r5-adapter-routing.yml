name: R5 Adapter Routing

on:
  push:
    branches:
      - sol/r5-adapter-routing-proof
  pull_request:
    paths:
      - 'src/echo_certification_forge/adapter_routing.py'
      - 'integrations/anvil/**'
      - 'scripts/r5_adapter_routing_gate.py'
      - 'scripts/verify_r5_adapter_routing.py'
      - 'contracts/family-*.schema.json'
      - 'tests/test_adapter_routing.py'
      - 'tests/test_anvil_routing_receipts.py'
      - '.github/workflows/r5-adapter-routing.yml'

permissions:
  contents: read

jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src integrations scripts tests
      - name: Focused R5 tests
        run: >-
          python -m pytest
          tests/test_adapter_routing.py
          tests/test_anvil_routing_receipts.py
          --cov=echo_certification_forge.adapter_routing
          --cov=integrations.anvil.family_routing_receipts
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Full repository regression
        run: python -m pytest
