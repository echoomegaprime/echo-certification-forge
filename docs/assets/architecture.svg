<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Echo Certification Forge architecture</title>
  <desc id="desc">Authenticated intake flows through isolated execution and evidence custody to deterministic signed verdicts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102847"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f0c873"/><stop offset="1" stop-color="#b9852f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#55b8ff"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <path d="M0 530C280 440 760 690 1200 500V675H0Z" fill="#0a1a2e" opacity=".75"/>
  <text x="72" y="80" fill="#f7fafc" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">CERTIFICATION FORGE</text>
  <rect x="72" y="101" width="118" height="4" rx="2" fill="url(#gold)"/>
  <text x="72" y="135" fill="#9db5ce" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2">IMMUTABLE EVIDENCE PLANE</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="72" y="210" width="270" height="190" rx="18" fill="#10233b" stroke="#315272"/>
    <text x="104" y="258" fill="#f0c873" font-size="15" letter-spacing="2">TRUST BOUNDARY 01</text>
    <text x="104" y="301" fill="#fff" font-size="27" font-weight="700">Governed intake</text>
    <text x="104" y="338" fill="#b8cadb" font-size="16">Tenant, project, policy</text>
    <text x="104" y="365" fill="#b8cadb" font-size="16">Exact source identity</text>
    <rect x="465" y="210" width="270" height="190" rx="18" fill="#10233b" stroke="#315272"/>
    <text x="497" y="258" fill="#f0c873" font-size="15" letter-spacing="2">TRUST BOUNDARY 02</text>
    <text x="497" y="301" fill="#fff" font-size="27" font-weight="700">Isolated execution</text>
    <text x="497" y="338" fill="#b8cadb" font-size="16">Sealed role images</text>
    <text x="497" y="365" fill="#b8cadb" font-size="16">Leases and replay controls</text>
    <rect x="858" y="210" width="270" height="190" rx="18" fill="#10233b" stroke="#806836"/>
    <text x="890" y="258" fill="#f0c873" font-size="15" letter-spacing="2">TRUST BOUNDARY 03</text>
    <text x="890" y="301" fill="#fff" font-size="27" font-weight="700">Signed verdict</text>
    <text x="890" y="338" fill="#b8cadb" font-size="16">Deterministic evaluation</text>
    <text x="890" y="365" fill="#b8cadb" font-size="16">Public-key verification</text>
  </g>
  <path d="M350 305H446" stroke="#55b8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M743 305H839" stroke="#55b8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="170" y="472" width="860" height="82" rx="41" fill="#071421" stroke="#315272"/>
  <circle cx="225" cy="513" r="17" fill="#55b8ff"/><path d="M216 513l7 7 13-17" fill="none" stroke="#071421" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="265" y="505" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650">APPEND-ONLY EVIDENCE CUSTODY</text>
  <text x="265" y="533" fill="#9db5ce" font-family="Segoe UI,Arial,sans-serif" font-size="15">Authenticated artifacts · Merkle roots · key lifecycle · audit chain</text>
  <text x="1128" y="624" text-anchor="end" fill="#f0c873" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2">ECHO OMEGA PRIME</text>
</svg>
